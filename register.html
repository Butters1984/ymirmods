<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Create Account - YMIR Mods</title>

  <style>
    :root {
      --bg: #07090d;
      --panel: rgba(18, 21, 27, 0.94);
      --gold: #ffdc8c;
      --orange: #ff9f1c;
      --muted: #bca97a;
      --text: #f4e5b5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;

      font-family: Georgia, "Times New Roman", serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(255, 155, 30, 0.10),
          transparent 25%
        ),
        radial-gradient(
          circle at 80% 75%,
          rgba(255, 190, 70, 0.08),
          transparent 25%
        ),
        linear-gradient(
          180deg,
          #05070a,
          #0b1117
        );
    }

    .register-card {
      width: min(460px, 100%);

      padding: 34px;

      border-radius: 20px;

      background:
        linear-gradient(
          180deg,
          rgba(23, 27, 34, 0.97),
          rgba(11, 14, 19, 0.97)
        );

      border:
        1px solid
        rgba(255, 194, 82, 0.16);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55),
        0 0 30px rgba(255, 150, 30, 0.07);
    }

    .logo {
      display: block;

      width: 76px;
      height: 76px;

      object-fit: cover;

      margin: 0 auto 18px;

      border-radius: 12px;

      filter:
        drop-shadow(
          0 0 12px rgba(255, 170, 35, 0.45)
        );
    }

    h1 {
      text-align: center;

      color: var(--gold);

      font-size: 2rem;

      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;

      color: var(--muted);

      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: #ead19b;

      font-weight: bold;
    }

    input {
      width: 100%;

      padding: 13px 14px;

      border-radius: 11px;

      border:
        1px solid
        rgba(255, 194, 82, 0.14);

      background:
        rgba(5, 8, 12, 0.85);

      color: #fff2cf;

      font-size: 1rem;

      outline: none;
    }

    input:focus {
      border-color:
        rgba(255, 184, 65, 0.50);

      box-shadow:
        0 0 16px
        rgba(255, 145, 20, 0.10);
    }

    button {
      width: 100%;

      margin-top: 8px;

      padding: 14px;

      border: 0;

      border-radius: 12px;

      cursor: pointer;

      font-weight: bold;

      font-size: 1rem;

      color: #15100a;

      background:
        linear-gradient(
          135deg,
          #d97706,
          #f2c15b
        );

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 30px
        rgba(217, 119, 6, 0.25);
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
      transform: none;
    }

    .message {
      display: none;

      margin-top: 18px;

      padding: 12px;

      border-radius: 10px;

      text-align: center;

      font-size: 0.92rem;
    }

    .message.success {
      display: block;

      color: #d9ffc8;

      background:
        rgba(91, 160, 64, 0.12);

      border:
        1px solid
        rgba(120, 210, 90, 0.20);
    }

    .message.error {
      display: block;

      color: #ffd1c2;

      background:
        rgba(190, 60, 35, 0.12);

      border:
        1px solid
        rgba(230, 90, 60, 0.20);
    }

    .home-link {
      display: block;

      margin-top: 22px;

      text-align: center;

      color: var(--orange);

      font-weight: bold;
    }

    .home-link:hover {
      color: var(--gold);
    }
  </style>
</head>

<body>

  <div class="register-card">

    <img
      src="ymirmodwebsiteicon.png"
      alt="YMIR Mods"
      class="logo"
    />

    <h1>Create YMIR Account</h1>

    <p class="subtitle">
      Join the YMIR Mods community.
    </p>

    <form id="registerForm">

      <div class="field">

        <label for="username">
          Username
        </label>

        <input
          id="username"
          name="username"
          type="text"
          minlength="3"
          maxlength="24"
          required
          autocomplete="username"
        />

      </div>

      <div class="field">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          name="email"
          type="email"
          required
          autocomplete="email"
        />

      </div>

      <div class="field">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          name="password"
          type="password"
          minlength="10"
          maxlength="128"
          required
          autocomplete="new-password"
        />

      </div>

      <div class="field">

        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          minlength="10"
          maxlength="128"
          required
          autocomplete="new-password"
        />

      </div>

      <button
        id="submitButton"
        type="submit"
      >
        Create Account
      </button>

      <div
        id="message"
        class="message"
      ></div>

    </form>

    <a
      class="home-link"
      href="/"
    >
      ← Back to YMIR Mods
    </a>

  </div>


  <script>
    const form =
      document.getElementById(
        "registerForm"
      );

    const message =
      document.getElementById(
        "message"
      );

    const button =
      document.getElementById(
        "submitButton"
      );


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        message.className =
          "message";

        message.textContent =
          "";


        const username =
          document
            .getElementById("username")
            .value
            .trim();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        const confirmPassword =
          document
            .getElementById(
              "confirmPassword"
            )
            .value;


        if (
          password !==
          confirmPassword
        ) {

          showMessage(
            "Passwords do not match.",
            false
          );

          return;
        }


        button.disabled = true;

        button.textContent =
          "Creating Account...";


        try {

          const response =
            await fetch(
              "/api/register",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    username,
                    email,
                    password
                  })
              }
            );


          const result =
            await response.json();


          if (
            !response.ok ||
            !result.success
          ) {

            showMessage(
              result.message ||
              "Account creation failed.",
              false
            );

            return;
          }


          showMessage(
            "Account created successfully! Your YMIR account now exists.",
            true
          );


          form.reset();


        } catch (error) {

          showMessage(
            "Unable to contact the YMIR server.",
            false
          );

        } finally {

          button.disabled = false;

          button.textContent =
            "Create Account";

        }
      }
    );


    function showMessage(
      text,
      success
    ) {

      message.textContent =
        text;

      message.className =
        success
          ? "message success"
          : "message error";
    }
  </script>

</body>
</html>
